<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rose-1:#fff0f3;
    --rose-2:#ffccd5;
    --rose-3:#ff8fa3;
    --rose-4:#ff4d6d;
    --rose-5:#c9184a;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;
    overflow-x:hidden;
    background:#1a0510;
  }

  /* ===== fluid stage: page width always equals the device width ===== */
  #stage{
    width:100%;
    position:relative;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 85% 25%, rgba(255,255,255,0.25), transparent 35%),
      linear-gradient(160deg,var(--rose-1) 0%,var(--rose-2) 28%,var(--rose-3) 60%,var(--rose-4) 85%,var(--rose-5) 100%);
    overflow:hidden;
    font-family:'Quicksand',sans-serif;
    padding-bottom:6vw;
  }

  /* ================= ENTRY GATE ================= */
  #entryGate{
    position:fixed;
    inset:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:8vw;
    background:linear-gradient(160deg,var(--rose-2) 0%,var(--rose-4) 55%,var(--rose-5) 100%);
    transition:opacity .6s ease, visibility .6s ease;
  }
  #entryGate.gate-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .gate-icon{
    font-size:16vw;
    line-height:1;
    animation:pulse 1.6s ease-in-out infinite;
    filter:drop-shadow(0 6px 10px rgba(120,0,30,0.35));
  }
  .gate-title{
    font-family:'Great Vibes',cursive;
    color:#fff;
    font-size:clamp(30px,9vw,48px);
    margin:3vw 0 1vw;
    text-shadow:0 2px 6px rgba(120,0,30,0.4);
  }
  .gate-sub{
    color:#fff0f3;
    font-size:clamp(13px,3.6vw,16px);
    margin:0 0 7vw;
    opacity:0.95;
  }
  #continueBtn{
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:clamp(15px,4.4vw,19px);
    color:var(--rose-5);
    background:#fff;
    border:none;
    padding:4vw 12vw;
    border-radius:50px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    letter-spacing:0.5px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  /* ================= BUNTING / TOP DECORATION ================= */
  .bunting-wrap{
    position:relative;
    width:100%;
    padding-top:4vw;
    display:flex;
    justify-content:center;
  }
  .bunting-main{
    width:112%;
    margin-left:-6%;
    display:block;
    filter:drop-shadow(0 6px 14px rgba(150,10,40,0.25));
    position:relative;
    z-index:3;
  }
  /* overflow edges of the bunting, echoed lower at both corners */
  .bunting-corner{
    position:absolute;
    top:19vw;
    width:26vw;
    height:13vw;
    background-image:url('https://res.cloudinary.com/dytmgsry3/image/upload/happy-birthday-bunting-flags-background-free-png.png');
    background-size:112% auto;
    background-repeat:no-repeat;
    opacity:0.95;
    filter:drop-shadow(0 6px 10px rgba(150,10,40,0.25));
    z-index:2;
  }
  .bunting-corner.left{
    left:0;
    background-position:left top;
    transform:rotate(-9deg);
    border-radius:0 0 0 14px;
  }
  .bunting-corner.right{
    right:0;
    background-position:right top;
    transform:rotate(9deg);
    border-radius:0 0 14px 0;
  }

  .title-script{
    text-align:center;
    font-family:'Great Vibes',cursive;
    color:var(--rose-5);
    font-size:clamp(26px,8vw,40px);
    margin:2vw 0 0;
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
  }

  /* ================= HEART PHOTO SECTION ================= */
  .photo-section{
    display:flex;
    justify-content:center;
    margin-top:5vw;
    position:relative;
    z-index:3;
  }
  .heart-frame{
    width:56vw;
    height:56vw;
    max-width:300px;
    max-height:300px;
    position:relative;
    clip-path:url(#heartClip);
    -webkit-clip-path:url(#heartClip);
    box-shadow:0 0 0 6px rgba(255,255,255,0.85) inset;
    background:#fff;
  }
  .heart-frame::after{
    content:"";
    position:absolute;
    inset:0;
    box-shadow:0 10px 30px rgba(150,10,40,0.35);
    pointer-events:none;
  }
  .photo-slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:translateX(100%);
    transition:transform .7s ease;
  }

  .bottom-decoration{
    text-align:center;
    margin-top:4vw;
    padding:0 8vw;
  }
  .bottom-decoration p{
    font-family:'Great Vibes',cursive;
    font-size:clamp(19px,5.5vw,26px);
    color:#7a0c2e;
    margin:0;
    line-height:1.3;
  }

  /* ================= VIDEO SECTION ================= */
  .crackers-anchor{
    position:relative;
    width:100%;
    margin-top:5vw;
  }
  .video-section{
    display:flex;
    justify-content:center;
    position:relative;
    z-index:3;
  }
  .video-frame{
    width:4cm;
    height:6cm;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 18px rgba(120,0,35,0.35);
    border:3px solid #fff;
    position:relative;
    background:#000;
  }
  .video-frame video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .closing-msg{
    text-align:center;
    margin-top:5vw;
    padding:0 8vw;
  }
  .closing-msg span{
    font-family:'Great Vibes',cursive;
    font-size:clamp(22px,6.5vw,30px);
    color:#7a0c2e;
  }

  /* ================= CORNER FLOWERS ================= */
  .flower-wrap{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:24vw;
    height:24vw;
    max-width:120px;
    max-height:120px;
    z-index:5;
    cursor:pointer;
  }
  .flower-wrap.left{left:-8vw;}
  .flower-wrap.right{right:-8vw;}
  .flower{
    width:100%;
    height:100%;
    position:relative;
    animation:spin 9s linear infinite;
    filter:drop-shadow(0 4px 10px rgba(120,0,30,0.4));
  }
  .petal{
    position:absolute;
    width:46%;
    height:46%;
    top:27%;
    left:27%;
    background:linear-gradient(135deg,var(--gold),var(--rose-4));
    border-radius:50% 0 50% 50%;
  }
  .petal:nth-child(1){transform:rotate(0deg) translate(30%) rotate(0deg);}
  .petal:nth-child(2){transform:rotate(60deg) translate(30%) rotate(-60deg);}
  .petal:nth-child(3){transform:rotate(120deg) translate(30%) rotate(-120deg);}
  .petal:nth-child(4){transform:rotate(180deg) translate(30%) rotate(-180deg);}
  .petal:nth-child(5){transform:rotate(240deg) translate(30%) rotate(-240deg);}
  .petal:nth-child(6){transform:rotate(300deg) translate(30%) rotate(-300deg);}
  .flower-center{
    position:absolute;
    width:34%;
    height:34%;
    top:33%;
    left:33%;
    background:radial-gradient(circle,#fff6d8,var(--gold));
    border-radius:50%;
    box-shadow:0 0 0 3px rgba(255,255,255,0.6);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #confetti-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:8;
    overflow:visible;
  }
  .confetti-piece{
    position:absolute;
    width:9px;
    height:14px;
    top:0;left:0;
    animation:burst 1.1s ease-out forwards;
  }
  @keyframes burst{
    0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0; }
  }

  /* ================= FALLING PETALS ================= */
  #petal-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;
    overflow:hidden;
  }
  .falling-petal{
    position:absolute;
    top:-30px;
    font-size:16px;
    animation:fall linear forwards;
    opacity:0.9;
  }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    50%{ transform:translateY(var(--fallHalf)) translateX(var(--sway)) rotate(180deg); }
    100%{ transform:translateY(var(--fallFull)) translateX(0) rotate(360deg); }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
      <path d="M0.5,0.88 C0.5,0.88 0.06,0.56 0.06,0.28 C0.06,0.10 0.20,0.0 0.35,0.0 C0.44,0.0 0.5,0.07 0.5,0.16 C0.5,0.07 0.56,0.0 0.65,0.0 C0.80,0.0 0.94,0.10 0.94,0.28 C0.94,0.56 0.5,0.88 0.5,0.88 Z"/>
    </clipPath>
  </defs>
</svg>

<!-- ============ ENTRY GATE ============ -->
<div id="entryGate">
  <div class="gate-icon">💌</div>
  <p class="gate-title">You've got a surprise</p>
  <p class="gate-sub">Tap continue to open it — with sound on 🔊</p>
  <button id="continueBtn">Continue</button>
</div>

<div id="stage">

  <!-- ============ BG & TOP DECORATION ============ -->
  <div class="bunting-wrap">
    <div class="bunting-corner left"></div>
    <div class="bunting-corner right"></div>
    <img class="bunting-main" src="https://res.cloudinary.com/dytmgsry3/image/upload/happy-birthday-bunting-flags-background-free-png.png" alt="Happy Birthday">
  </div>
  <p class="title-script">A little surprise for you 💗</p>

  <!-- ============ PHOTO SECTION ============ -->
  <div class="photo-section">
    <div class="heart-frame" id="heartFrame"></div>
  </div>

  <!-- ============ BOTTOM DECORATION ============ -->
  <div class="bottom-decoration">
    <p>Every picture with you is a memory I treasure 🌸</p>
  </div>

  <!-- ============ VIDEO SECTION + CORNER FLOWERS ============ -->
  <div class="crackers-anchor">
    <div class="flower-wrap left" id="flowerLeft">
      <div class="flower">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="flower-center"></div>
      </div>
    </div>
    <div class="flower-wrap right" id="flowerRight">
      <div class="flower">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="flower-center"></div>
      </div>
    </div>
    <div class="video-section">
      <div class="video-frame">
        <video id="wishVideo" muted loop playsinline webkit-playsinline>
          <source src="https://res.cloudinary.com/dytmgsry3/video/upload/snaptik_7666554784996166920_v3.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <div class="closing-msg"><span>Happy Birthday! I love you so much 🎂</span></div>

  <div id="confetti-layer"></div>
  <div id="petal-layer"></div>
</div>

<script>
/* ---------- heart photo slider, right to left, every 3s ---------- */
const photos = [
"https://res.cloudinary.com/dytmgsry3/image/upload/4ad0dc0263547580e495ddca40d36660.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/4568b43d636bf404bf4d4ae087ea331d.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/cadf8bcc6ce4e06d9ced80de21207e78.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/1c3f69c5e8334fadaf41a32c0680e36f.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/c84b78c303f40fd4663415ef99286309.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/3d527397d340db2e0deda995262584eb.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/08406d5cf2b601c23a2a7e2f658f8439.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/1c0f13538ad13ce85e6b58ad62aa3b12.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/fc87361802a7f4626c6cdb9ae1afa28c.webp",
"https://res.cloudinary.com/dytmgsry3/image/upload/1.jpg",
"https://res.cloudinary.com/dytmgsry3/image/upload/3.jpg",
"https://res.cloudinary.com/dytmgsry3/image/upload/10.jpg",
"https://res.cloudinary.com/dytmgsry3/image/upload/15.jpg"
];
const heartFrame = document.getElementById('heartFrame');
const slideEls = photos.map((src,i)=>{
  const img = document.createElement('img');
  img.src = src;
  img.className = 'photo-slide';
  img.alt = 'birthday girl';
  if(i===0) img.style.transform = 'translateX(0%)';
  heartFrame.appendChild(img);
  return img;
});
let photoIdx = 0;
function nextPhoto(){
  const cur = photoIdx;
  const nxt = (photoIdx+1) % slideEls.length;
  slideEls[cur].style.transition = 'transform .7s ease';
  slideEls[cur].style.transform = 'translateX(-100%)';
  slideEls[nxt].style.transition = 'transform .7s ease';
  slideEls[nxt].style.transform = 'translateX(0%)';
  setTimeout(()=>{
    slideEls[cur].style.transition = 'none';
    slideEls[cur].style.transform = 'translateX(100%)';
  }, 720);
  photoIdx = nxt;
}
setInterval(nextPhoto, 3000);

/* ---------- confetti burst from a corner flower ---------- */
const stage = document.getElementById('stage');
const confettiLayer = document.getElementById('confetti-layer');
const confettiColors = ['#ff4d6d','#ffd166','#06d6a0','#118ab2','#c9184a','#ffffff','#ff8fa3'];
function burstConfettiFrom(flowerEl){
  const stageRect = stage.getBoundingClientRect();
  const fRect = flowerEl.getBoundingClientRect();
  const originX = fRect.left - stageRect.left + fRect.width/2;
  const originY = fRect.top - stageRect.top + fRect.height/2;
  for(let i=0;i<26;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const angle = Math.random()*Math.PI*2;
    const dist = 100 + Math.random()*150;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 50;
    p.style.left = originX+'px';
    p.style.top = originY+'px';
    p.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    p.style.animationDelay = (Math.random()*0.15)+'s';
    confettiLayer.appendChild(p);
    setTimeout(()=>p.remove(), 1400);
  }
}
const flowerLeft = document.getElementById('flowerLeft');
const flowerRight = document.getElementById('flowerRight');
flowerLeft.addEventListener('click', ()=>burstConfettiFrom(flowerLeft));
flowerRight.addEventListener('click', ()=>burstConfettiFrom(flowerRight));

let burstsStarted = false;
function startPeriodicBursts(){
  if(burstsStarted) return;
  burstsStarted = true;
  setInterval(()=>burstConfettiFrom(flowerLeft), 5000);
  setInterval(()=>burstConfettiFrom(flowerRight), 6500);
}

/* ---------- continuous falling petals ---------- */
const petalLayer = document.getElementById('petal-layer');
const petalEmojis = ['🌸','💮','🌺','❀','🌷'];
function spawnPetal(){
  const el = document.createElement('div');
  el.className = 'falling-petal';
  el.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
  const startX = Math.random()*stage.offsetWidth;
  const duration = 6 + Math.random()*5;
  const sway = (Math.random()*80-40)+'px';
  const stageHeight = stage.offsetHeight || 1200;
  el.style.left = startX+'px';
  el.style.fontSize = (12+Math.random()*10)+'px';
  el.style.setProperty('--fallHalf', (stageHeight*0.5)+'px');
  el.style.setProperty('--fallFull', (stageHeight+40)+'px');
  el.style.setProperty('--sway', sway);
  el.style.animationDuration = duration+'s';
  petalLayer.appendChild(el);
  setTimeout(()=>el.remove(), duration*1000+200);
}
setInterval(spawnPetal, 450);
for(let i=0;i<6;i++) setTimeout(spawnPetal, i*200);

/* ---------- entry gate: dismiss + play & unmute video on tap ---------- */
const gate = document.getElementById('entryGate');
const continueBtn = document.getElementById('continueBtn');
const video = document.getElementById('wishVideo');
function enterSite(){
  gate.classList.add('gate-hidden');
  video.muted = false;
  video.currentTime = 0;
  video.play().catch(()=>{});
  burstConfettiFrom(flowerLeft);
  burstConfettiFrom(flowerRight);
  startPeriodicBursts();
  setTimeout(()=>{ gate.style.display = 'none'; }, 700);
}
continueBtn.addEventListener('click', enterSite);
</script>
</body>
</html>
